<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJK Battle - Mobile Fixed</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: #111; }
        
        /* Health and Cooldown UI */
        #game-ui { position: absolute; top: 10px; width: 100%; display: none; justify-content: space-around; z-index: 5; pointer-events: none; }
        .hb-cont { width: 40%; }
        .hb { width: 100%; height: 15px; background: #333; border: 1px solid #fff; }
        .fill-hp { width: 100%; height: 100%; background: #0f0; }
        .fill-cd { width: 0%; height: 100%; background: #0cf; }

        /* MENU - Full screen block */
        #menu-overlay { 
            position: absolute; inset: 0; background: #111; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 1000; 
        }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .menu-btn { padding: 20px; background: #333; color: #fff; border: 2px solid #fff; border-radius: 10px; font-weight: bold; }

        /* VISIBLE MOBILE CONTROLS */
        .v-pad { position: absolute; bottom: 20px; width: 180px; height: 140px; display: none; z-index: 100; }
        #p1-pad { left: 10px; }
        #p2-pad { right: 10px; }
        
        .ctrl-btn { 
            position: absolute; width: 55px; height: 55px; 
            background: rgba(80, 80, 80, 0.7); /* Grey background so they are visible */
            border: 2px solid #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 10px; font-weight: bold; color: white;
            pointer-events: none; /* Touches are handled by the window, not the button elements */
        }
        
        .up { top: 0; left: 60px; background: rgba(100, 100, 100, 0.8); }
        .left { top: 60px; left: 0; }
        .right { top: 60px; left: 120px; }
        .atk { bottom: -20px; left: 30px; border-color: #f00; }
        .spec { bottom: -20px; left: 95px; border-color: #0cf; }

        #pause-btn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1001; display: none; padding: 10px; }
    </style>
</head>
<body>

<div id="menu-overlay">
    <h1>JJK STICKMAN</h1>
    <div id="step-1">
        <button class="menu-btn" onclick="setMode('1P')">1P (VS CPU)</button>
        <button class="menu-btn" onclick="setMode('2P')">2P (VERSUS)</button>
    </div>
    <div id="step-2" style="display:none;">
        <h2 id="prompt">SELECT CHARACTER</h2>
        <div class="grid" id="char-grid"></div>
    </div>
</div>

<div id="game-ui">
    <div class="hb-cont"><div id="p1-name">P1</div><div class="hb"><div id="p1-hp" class="fill-hp"></div></div><div class="hb" style="height:5px;"><div id="p1-cd" class="fill-cd"></div></div></div>
    <div class="hb-cont" style="text-align:right;"><div id="p2-name">P2</div><div class="hb"><div id="p2-hp" class="fill-hp"></div></div><div class="hb" style="height:5px;"><div id="p2-cd" class="fill-cd"></div></div></div>
</div>

<button id="pause-btn" class="menu-btn" onclick="togglePause()">PAUSE</button>

<div id="p1-pad" class="v-pad">
    <div class="ctrl-btn up">JUMP</div><div class="ctrl-btn left">L</div><div class="ctrl-btn right">R</div>
    <div class="ctrl-btn atk">ATK</div><div class="ctrl-btn spec">SP</div>
</div>

<div id="p2-pad" class="v-pad">
    <div class="ctrl-btn up">JUMP</div><div class="ctrl-btn left">L</div><div class="ctrl-btn right">R</div>
    <div class="ctrl-btn atk">ATK</div><div class="ctrl-btn spec">SP</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gravity = 0.8;
let mode = '1P', p1, p2, p1C, p2C, gameRunning = false, paused = false;

const chars = {
    'Gojo': { c: '#fff', sp: 6, d: 8, r: 50 },
    'Sukuna': { c: '#f44', sp: 7, d: 10, r: 60 },
    'Itadori': { c: '#fd0', sp: 8, d: 12, r: 45 },
    'Megumi': { c: '#44f', sp: 5, d: 7, r: 55 },
    'Nanami': { c: '#dca', sp: 5, d: 15, r: 60 },
    'Maki': { c: '#4a4', sp: 9, d: 9, r: 80 }
};

class Fighter {
    constructor(x, y, key, pNum, isCPU) {
        this.name = key; this.s = chars[key];
        this.x = x; this.y = y; this.w = 40; this.h = 90;
        this.hp = 100; this.vx = 0; this.vy = 0;
        this.dir = pNum === 1 ? 1 : -1;
        this.isCPU = isCPU; this.atking = false; this.cd = 0;
    }
    draw() {
        ctx.strokeStyle = this.s.c; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(this.x+20, this.y-15, 12, 0, 7); ctx.stroke(); // Head
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y); ctx.lineTo(this.x+20, this.y+50); ctx.stroke(); // Torso
        let r = this.atking ? this.s.r : 20;
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+15); ctx.lineTo(this.x+20+(r*this.dir), this.y+20); ctx.stroke(); // Arm
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+50); ctx.lineTo(this.x, this.y+90); ctx.stroke(); // Legs
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+50); ctx.lineTo(this.x+40, this.y+90); ctx.stroke();
    }
    update(opp) {
        if(paused) return;
        this.x += this.vx; this.y += this.vy;
        if(this.y + this.h < canvas.height-50) this.vy += gravity; else { this.y = canvas.height-50-this.h; this.vy = 0; }
        this.x = Math.max(0, Math.min(canvas.width-this.w, this.x));
        if(this.cd > 0) this.cd--;
        if(this.isCPU) this.ai(opp);
    }
    atk(opp) {
        if(this.atking) return; this.atking = true;
        if(Math.abs(this.x - opp.x) < this.s.r + 20 && Math.abs(this.y - opp.y) < 60) opp.hp -= this.s.d;
        setTimeout(() => this.atking = false, 150);
    }
    spec(opp) {
        if(this.cd > 0) return; this.cd = 200;
        if(this.name==='Gojo'){ opp.hp-=20; ctx.fillStyle='purple'; ctx.fillRect(0,this.y,canvas.width,30); }
        else { this.vx = this.dir*40; opp.hp-=15; }
    }
    ai(opp) {
        this.vx = (opp.x < this.x) ? -3 : 3; this.dir = (opp.x < this.x) ? -1 : 1;
        if(Math.abs(this.x - opp.x) < 50) this.atk(opp);
    }
}

// TOUCH SYSTEM
const t1 = {l:0, r:0, u:0, a:0, s:0}, t2 = {l:0, r:0, u:0, a:0, s:0};
function handleTouch(e) {
    if(!gameRunning) return;
    e.preventDefault();
    [t1, t2].forEach(p => { p.l=p.r=p.u=p.a=p.s=0; });
    for(let t of e.touches) {
        const x = t.clientX, y = t.clientY, w = window.innerWidth, h = window.innerHeight;
        const side = x < w/2 ? t1 : t2;
        const off = x < w/2 ? 0 : w/2;
        if(y > h - 180) { // Bottom area
            const localX = x - off;
            if(localX < 60) side.l = 1;
            else if(localX > 120) side.r = 1;
            else { if(y < h - 90) side.u = 1; else side.a = 1; }
            if(localX > 100 && y > h - 60) side.s = 1;
        }
    }
}
window.addEventListener('touchstart', handleTouch, {passive:false});
window.addEventListener('touchend', handleTouch, {passive:false});
window.addEventListener('touchmove', handleTouch, {passive:false});

function setMode(m) {
    mode = m;
    document.getElementById('step-1').style.display = 'none';
    document.getElementById('step-2').style.display = 'block';
    const grid = document.getElementById('char-grid');
    Object.keys(chars).forEach(n => {
        const b = document.createElement('button'); b.className = "menu-btn"; b.innerText = n;
        b.onclick = () => pick(n);
        grid.appendChild(b);
    });
}

function pick(n) {
    if(!p1C) { p1C = n; document.getElementById('prompt').innerText = "P2 SELECT"; if(mode === '1P') { p2C = 'Sukuna'; start(); } }
    else { p2C = n; start(); }
}

function start() {
    document.getElementById('menu-overlay').style.display = 'none';
    document.getElementById('game-ui').style.display = 'flex';
    document.getElementById('pause-btn').style.display = 'block';
    
    // Always show controls on mobile-sized screens
    if(window.innerWidth < 1024) {
        document.getElementById('p1-pad').style.display = 'block';
        if(mode === '2P') document.getElementById('p2-pad').style.display = 'block';
    }
    
    p1 = new Fighter(100, 100, p1C, 1, false);
    p2 = new Fighter(canvas.width-150, 100, p2C, 2, mode==='1P');
    gameRunning = true;
    resize(); loop();
}

function togglePause() { paused = !paused; }
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

const keys = {}; window.onkeydown = e => keys[e.code] = true; window.onkeyup = e => keys[e.code] = false;

function loop() {
    if(!gameRunning) return;
    if(!paused) {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#333'; ctx.fillRect(0, canvas.height-50, canvas.width, 50);

        p1.vx = 0;
        if(keys.KeyA || t1.l) { p1.vx = -p1.s.sp; p1.dir = -1; }
        if(keys.KeyD || t1.r) { p1.vx = p1.s.sp; p1.dir = 1; }
        if((keys.KeyW || t1.u) && p1.vy === 0) p1.vy = -16;
        if(keys.Space || t1.a) p1.atk(p2);
        if(keys.KeyE || t1.s) p1.spec(p2);

        if(mode === '2P') {
            p2.vx = 0;
            if(keys.ArrowLeft || t2.l) { p2.vx = -p2.s.sp; p2.dir = -1; }
            if(keys.ArrowRight || t2.r) { p2.vx = p2.s.sp; p2.dir = 1; }
            if((keys.ArrowUp || t2.u) && p2.vy === 0) p2.vy = -16;
            if(keys.Enter || t2.a) p2.atk(p1);
            if(keys.ShiftRight || t2.s) p2.spec(p1);
        }

        p1.update(p2); p2.update(p1);
        p1.draw(); p2.draw();

        document.getElementById('p1-hp').style.width = p1.hp + '%';
        document.getElementById('p2-hp').style.width = p2.hp + '%';
        document.getElementById('p1-cd').style.width = (200-p1.cd)/2 + '%';
        document.getElementById('p2-cd').style.width = (200-p2.cd)/2 + '%';

        if(p1.hp <= 0 || p2.hp <= 0) {
            alert(p1.hp <= 0 ? "P2 WINS" : "P1 WINS");
            location.reload();
            return;
        }
    }
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
