<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJK: Ultimate Cursed Clash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="p1-hud" class="hud"><div class="bar"><div id="p1-hp" class="hp-f"></div></div></div>
        <div id="p2-hud" class="hud"><div class="bar"><div id="p2-hp" class="hp-f"></div></div></div>
    </div>

    <div id="pause-screen" class="overlay" style="display:none; background: rgba(0,0,0,0.9); z-index: 1000000;">
        <h1>PAUSED</h1>
        <button class="menu-btn" onclick="togglePause()">RESUME</button>
        <button class="menu-btn" onclick="location.reload()">MAIN MENU</button>
    </div>

    <div id="menu" class="overlay">
        <h1 class="title">JJK BATTLE</h1>
        <div id="m-start">
            <button class="menu-btn" onclick="initMode('1P')">1P vs CPU</button>
            <button class="menu-btn" onclick="initMode('2P')">2P VERSUS</button>
        </div>
        <div id="m-char" style="display:none; width: 95%;">
            <h2 id="sel-title">SELECT CHARACTER</h2>
            <div class="grid" id="char-grid"></div>
        </div>
    </div>

    <div id="controls" class="ctrl-container">
        <div id="p1-pad" class="corner-pad left">
            <div class="btn btn-jump" data-p="1" data-v="u">JUMP</div>
            <div class="btn-group">
                <div class="btn btn-dir" data-p="1" data-v="l">←</div>
                <div class="btn btn-dir" data-p="1" data-v="r">→</div>
            </div>
            <div class="btn-group">
                <div class="btn btn-atk" data-p="1" data-v="a">ATK</div>
                <div class="btn btn-skill" data-p="1" data-v="s">SKILL</div>
            </div>
        </div>
        <div id="p2-pad" class="corner-pad right" style="display:none;">
            <div class="btn btn-jump" data-p="2" data-v="u">JUMP</div>
            <div class="btn-group">
                <div class="btn btn-dir" data-p="2" data-v="l">←</div>
                <div class="btn btn-dir" data-p="2" data-v="r">→</div>
            </div>
            <div class="btn-group">
                <div class="btn btn-atk" data-p="2" data-v="a">ATK</div>
                <div class="btn btn-skill" data-p="2" data-v="s">SKILL</div>
            </div>
        </div>
    </div>

    <button id="pause-btn" onclick="togglePause()">II</button>

    <canvas id="game"></canvas>
    <script src="script.js"></script>
</body>
</html>
