<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJK Stickman: Local Versus</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        canvas { display: block; background: #1a1a1a; }
        
        /* UI Bars */
        #ui { position: absolute; top: 10px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .stat-group { width: 40%; }
        .bar-bg { width: 100%; height: 12px; background: #333; border: 1px solid #fff; margin-bottom: 4px; border-radius: 4px; overflow: hidden; }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0f0, #0a0); transition: 0.2s; }
        .cd-fill { width: 0%; height: 100%; background: #0cf; transition: 0.1s; }
        
        /* Overlays */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        button { padding: 15px 25px; background: #222; color: #fff; border: 1px solid #555; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:active { background: #6200ea; }

        /* Pause Button */
        #pause-btn { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 50; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; border: 1px solid #fff; }

        /* Mobile Layout */
        .v-pad { position: absolute; bottom: 20px; width: 180px; height: 150px; display: none; }
        #p1-pad { left: 20px; }
        #p2-pad { right: 20px; }
        .btn { position: absolute; width: 55px; height: 55px; background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        
        /* Button Mapping */
        .b-up { top: 0; left: 60px; }
        .b-left { top: 60px; left: 0; }
        .b-right { top: 60px; right: 0; }
        .b-atk { bottom: -20px; left: 10px; background: rgba(255,0,0,0.3); }
        .b-spec { bottom: -20px; right: 10px; background: rgba(0,150,255,0.3); }
    </style>
</head>
<body>

<div id="menu" class="overlay">
    <h1>JJK STICKMAN</h1>
    <div id="m-opts">
        <button onclick="setMode('1P')">P1 VS CPU</button>
        <button onclick="setMode('2P')">P1 VS P2</button>
    </div>
    <div id="c-sel" style="display:none;">
        <h2 id="prompt">P1: SELECT SORCERER</h2>
        <div class="grid" id="char-grid"></div>
    </div>
</div>

<div id="end-screen" class="overlay" style="display:none;">
    <h1 id="winner-text">P1 WINS!</h1>
    <button onclick="location.reload()">REMATCH</button><br>
    <button onclick="location.reload()">QUIT</button>
</div>

<div id="pause-screen" class="overlay" style="display:none;">
    <h1>PAUSED</h1>
    <button onclick="togglePause()">RESUME</button>
</div>

<div id="ui">
    <div class="stat-group">
        <div id="p1-name">P1</div>
        <div class="bar-bg"><div id="p1-hp" class="hp-fill"></div></div>
        <div class="bar-bg" style="height:5px;"><div id="p1-cd" class="cd-fill"></div></div>
    </div>
    <div class="stat-group" style="text-align:right;">
        <div id="p2-name">P2</div>
        <div class="bar-bg"><div id="p2-hp" class="hp-fill"></div></div>
        <div class="bar-bg" style="height:5px;"><div id="p2-cd" class="cd-fill"></div></div>
    </div>
</div>

<button id="pause-btn" onclick="togglePause()">||</button>

<div id="p1-pad" class="v-pad">
    <div class="btn b-up">JUMP</div> <div class="btn b-left">←</div> <div class="btn b-right">→</div>
    <div class="btn b-atk">ATK</div> <div class="btn b-spec">SKILL</div>
</div>
<div id="p2-pad" class="v-pad">
    <div class="btn b-up">JUMP</div> <div class="btn b-left">←</div> <div class="btn b-right">→</div>
    <div class="btn b-atk">ATK</div> <div class="btn b-spec">SKILL</div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const gravity = 0.8;
let paused = false, mode = '1P', p1, p2, p1C, p2C;

const chars = {
    'Gojo': { c: '#fff', sp: 6, d: 8, r: 50, w: 'none' },
    'Sukuna': { c: '#f44', sp: 7, d: 10, r: 60, w: 'cleaver' },
    'Itadori': { c: '#fd0', sp: 8, d: 12, r: 45, w: 'fist' },
    'Megumi': { c: '#44f', sp: 5, d: 7, r: 55, w: 'sword' },
    'Nanami': { c: '#dca', sp: 5, d: 15, r: 60, w: 'blunt' },
    'Maki': { c: '#4a4', sp: 9, d: 9, r: 80, w: 'spear' }
};

class Fighter {
    constructor(x, y, key, pNum, isCPU) {
        this.name = key; this.s = chars[key];
        this.x = x; this.y = y; this.w = 40; this.h = 90;
        this.hp = 100; this.vx = 0; this.vy = 0;
        this.dir = pNum === 1 ? 1 : -1;
        this.isCPU = isCPU; this.atking = false; this.cd = 0;
        this.maxCd = 180;
    }
    draw() {
        ctx.strokeStyle = this.s.c; ctx.lineWidth = 4; ctx.lineCap = 'round';
        // Head & Body
        ctx.beginPath(); ctx.arc(this.x+20, this.y-15, 12, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y); ctx.lineTo(this.x+20, this.y+50); ctx.stroke();
        
        // Weapon Sprite logic
        let reach = this.atking ? this.s.r : 20;
        let armX = this.x+20 + (reach * this.dir);
        let armY = this.y+20;
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+15); ctx.lineTo(armX, armY); ctx.stroke();
        
        if(this.s.w !== 'none') {
            ctx.strokeStyle = '#999';
            if(this.s.w === 'spear') {
                ctx.beginPath(); ctx.moveTo(armX, armY); ctx.lineTo(armX + (30*this.dir), armY); ctx.stroke();
            } else if(this.s.w === 'sword') {
                ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(armX, armY); ctx.lineTo(armX + (20*this.dir), armY-20); ctx.stroke();
            } else if(this.s.w === 'cleaver') {
                ctx.fillStyle = '#666'; ctx.fillRect(armX, armY-10, 15*this.dir, 20);
            }
        }
        
        // Legs
        ctx.strokeStyle = this.s.c; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+50); ctx.lineTo(this.x, this.y+90); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(this.x+20, this.y+50); ctx.lineTo(this.x+40, this.y+90); ctx.stroke();
    }
    update(opp) {
        if(paused) return;
        this.x += this.vx; this.y += this.vy;
        if(this.y + this.h < canvas.height-50) this.vy += gravity; else { this.y = canvas.height-50-this.h; this.vy = 0; }
        this.x = Math.max(0, Math.min(canvas.width-this.w, this.x));
        if(this.cd > 0) this.cd--;
        if(this.isCPU) this.ai(opp);
    }
    atk(opp) {
        if(this.atking) return; this.atking = true;
        if(Math.abs(this.x - opp.x) < this.s.r + 25 && Math.abs(this.y - opp.y) < 60) opp.hp -= this.s.d;
        setTimeout(() => this.atking = false, 150);
    }
    spec(opp) {
        if(this.cd > 0) return; this.cd = this.maxCd;
        if(this.name==='Gojo'){ opp.hp-=25; ctx.fillStyle='rgba(150,0,255,0.5)'; ctx.fillRect(0,this.y-20,canvas.width,50); }
        else { this.vx = this.dir*40; opp.hp-=15; }
    }
    ai(opp) {
        this.vx = (opp.x < this.x) ? -3 : 3; this.dir = (opp.x < this.x) ? -1 : 1;
        if(Math.abs(this.x - opp.x) < 60) this.atk(opp);
        if(Math.random() < 0.01) this.spec(opp);
    }
}

// Controls Logic
const t1 = {l:0, r:0, u:0, a:0, s:0}, t2 = {l:0, r:0, u:0, a:0, s:0};
function handleT(e) {
    e.preventDefault();
    [t1, t2].forEach(p => { p.l=p.r=p.u=p.a=p.s=0; });
    for(let t of e.touches) {
        const x = t.clientX, y = t.clientY, w = window.innerWidth;
        if(x < w/2) mapT(x, y, t1, 0); else if(mode==='2P') mapT(x, y, t2, w/2+40);
    }
}
function mapT(x, y, p, off) {
    const b = window.innerHeight;
    if(y > b-160) {
        if(x > off && x < off+60) p.l=1;
        else if(x > off+60 && x < off+120) { if(y < b-80) p.u=1; else p.a=1; }
        else if(x > off+120) { if(y > b-80) p.s=1; else p.r=1; }
    }
}
window.addEventListener('touchstart', handleT); window.addEventListener('touchend', handleT); window.addEventListener('touchmove', handleT);

function setMode(m) {
    mode = m; document.getElementById('m-opts').style.display = 'none';
    document.getElementById('c-sel').style.display = 'block';
    const grid = document.getElementById('char-grid');
    Object.keys(chars).forEach(n => {
        const b = document.createElement('button'); b.innerText = n;
        b.onclick = () => {
            if(!p1C) { p1C = n; document.getElementById('prompt').innerText = "P2: SELECT SORCERER"; if(mode==='1P') { p2C=Object.keys(chars)[Math.floor(Math.random()*6)]; start(); } }
            else { p2C = n; start(); }
        };
        grid.appendChild(b);
    });
}

function start() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('p1-pad').style.display = 'block';
    if(mode==='2P') document.getElementById('p2-pad').style.display = 'block';
    p1 = new Fighter(100, 100, p1C, 1, false);
    p2 = new Fighter(canvas.width-150, 100, p2C, 2, mode==='1P');
    resize(); loop();
}

function togglePause() { 
    paused = !paused; 
    document.getElementById('pause-screen').style.display = paused ? 'flex' : 'none';
}

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.onresize = resize; resize();

const keys = {}; window.onkeydown = e => keys[e.code] = true; window.onkeyup = e => keys[e.code] = false;

function loop() {
    if(!paused) {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = '#111'; ctx.fillRect(0, canvas.height-50, canvas.width, 50);

        // P1
        p1.vx = 0;
        if(keys.KeyA || t1.l) { p1.vx = -p1.s.sp; p1.dir = -1; }
        if(keys.KeyD || t1.r) { p1.vx = p1.s.sp; p1.dir = 1; }
        if((keys.KeyW || t1.u) && p1.vy === 0) p1.vy = -16;
        if(keys.Space || t1.a) p1.atk(p2);
        if(keys.KeyE || t1.s) p1.spec(p2);

        // P2
        if(mode==='2P') {
            p2.vx = 0;
            if(keys.ArrowLeft || t2.l) { p2.vx = -p2.s.sp; p2.dir = -1; }
            if(keys.ArrowRight || t2.r) { p2.vx = p2.s.sp; p2.dir = 1; }
            if((keys.ArrowUp || t2.u) && p2.vy === 0) p2.vy = -16;
            if(keys.Enter || t2.a) p2.atk(p1);
            if(keys.ShiftRight || t2.s) p2.spec(p1);
        }

        p1.update(p2); p2.update(p1);
        p1.draw(); p2.draw();

        document.getElementById('p1-hp').style.width = p1.hp + '%';
        document.getElementById('p2-hp').style.width = p2.hp + '%';
        document.getElementById('p1-cd').style.width = ((p1.maxCd - p1.cd)/p1.maxCd)*100 + '%';
        document.getElementById('p2-cd').style.width = ((p2.maxCd - p2.cd)/p2.maxCd)*100 + '%';

        if(p1.hp <= 0 || p2.hp <= 0) {
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('winner-text').innerText = p1.hp <= 0 ? p2C + " WINS!" : p1C + " WINS!";
            return;
        }
    }
    requestAnimationFrame(loop);
}
</script>
</body>
</html>
