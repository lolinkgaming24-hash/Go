<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JJK Stickman Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="menu" class="overlay">
        <h1>JJK BATTLE</h1>
        <div id="m-start">
            <button onclick="initMode('1P')">P1 VS CPU</button>
            <button onclick="initMode('2P')">P1 VS P2</button>
        </div>
        <div id="m-char" style="display:none;">
            <h2 id="sel-title">P1 SELECT</h2>
            <div class="grid" id="char-grid"></div>
        </div>
    </div>

    <div id="pause-screen" class="overlay" style="display:none; background: rgba(0,0,0,0.7);">
        <h1>PAUSED</h1>
        <button onclick="togglePause()">RESUME</button>
    </div>

    <div id="end-screen" class="overlay" style="display:none;">
        <h1 id="win-msg">WINNER</h1>
        <button onclick="location.reload()">REMATCH</button>
    </div>

    <div id="ui-layer">
        <div id="p1-hud" class="hud">
            <div id="p1-n">P1</div>
            <div class="bar"><div id="p1-hp" class="hp-f"></div></div>
            <div class="bar" style="height:5px;"><div id="p1-sp" class="sp-f"></div></div>
        </div>
        <div id="p2-hud" class="hud">
            <div id="p2-n">P2</div>
            <div class="bar"><div id="p2-hp" class="hp-f"></div></div>
            <div class="bar" style="height:5px;"><div id="p2-sp" class="sp-f"></div></div>
        </div>
    </div>

    <button id="pause-btn" onclick="togglePause()">PAUSE</button>

    <div id="controls" class="ctrl-container">
        <div id="p1-pad" class="pad">
            <div class="btn btn-up">UP</div><div class="btn btn-l">L</div><div class="btn btn-r">R</div>
            <div class="btn btn-m1">M1</div><div class="btn btn-sp">SP</div>
        </div>
        <div id="p2-pad" class="pad">
            <div class="btn btn-up">UP</div><div class="btn btn-l">L</div><div class="btn btn-r">R</div>
            <div class="btn btn-m1">M1</div><div class="btn btn-sp">SP</div>
        </div>
    </div>

    <canvas id="game"></canvas>

    <script src="script.js"></script>
</body>
</html>
